apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-node-liveness-detector
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sample-node-liveness-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-node-liveness-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-node-liveness-detector
    spec:
      serviceAccountName: sample-node-liveness-detector
      priorityClassName: system-cluster-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: detector
          image: registry.k8s.io/e2e-test-images/sample-node-liveness-detector:0.1
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --probe-interval=10s
            - --failure-threshold=3
            - --warmup-duration=20s
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
